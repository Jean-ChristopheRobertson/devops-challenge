name: ci

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - k8s/overlays/minikube/kustomization.yaml

permissions:
  contents: read

env:
  POSTGRES_PRISMA_URL: postgresql://postgres:postgres@localhost:5432/currencies?schema=public

jobs:
  verify:
    if: >-
      github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: CI
        run: pnpm ci:verify

  build-and-publish:
    if: >-
      github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm cd:build

      - name: Build container images
        if: github.event_name == 'pull_request'
        run: pnpm ci:image

      - name: Login to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract application image metadata
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: application-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/devops-challenge
          tags: |
            type=sha,prefix=sha-,format=long
            type=raw,value=latest

      - name: Extract migration image metadata
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: migration-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/devops-challenge-migrate
          tags: |
            type=sha,prefix=sha-,format=long
            type=raw,value=latest

      - name: Build and push application image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: true
          tags: ${{ steps.application-meta.outputs.tags }}
          labels: ${{ steps.application-meta.outputs.labels }}

      - name: Build and push migration image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrator
          push: true
          tags: ${{ steps.migration-meta.outputs.tags }}
          labels: ${{ steps.migration-meta.outputs.labels }}

      - name: Verify public GHCR image access
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GHCR_OWNER: ${{ github.repository_owner }}
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          owner = os.environ["GHCR_OWNER"].lower()
          tag = os.environ["IMAGE_TAG"]
          accept = "application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.v2+json"
          attempts = 10

          for image in ("devops-challenge", "devops-challenge-migrate"):
              for attempt in range(1, attempts + 1):
                  try:
                      scope = f"repository:{owner}/{image}:pull"
                      token_url = "https://ghcr.io/token?" + urllib.parse.urlencode({"service": "ghcr.io", "scope": scope})
                      with urllib.request.urlopen(token_url) as response:
                          token = json.load(response)["token"]

                      request = urllib.request.Request(
                          f"https://ghcr.io/v2/{owner}/{image}/manifests/{tag}",
                          method="HEAD",
                          headers={"Accept": accept, "Authorization": f"Bearer {token}"},
                      )
                      with urllib.request.urlopen(request) as response:
                          if response.status != 200:
                              raise RuntimeError(f"unexpected status {response.status}")

                      print(f"Anonymous pull verified: ghcr.io/{owner}/{image}:{tag}")
                      break
                  except (urllib.error.HTTPError, urllib.error.URLError, RuntimeError, KeyError) as error:
                      if attempt == attempts:
                          raise SystemExit(
                              f"Anonymous pull failed for ghcr.io/{owner}/{image}:{tag} after {attempts} attempts. "
                              "Set the container package visibility to public in GitHub Packages."
                          ) from error
                      print(f"Anonymous pull not yet available for {image} ({error}); retrying in 15 seconds")
                      time.sleep(15)
          PY
