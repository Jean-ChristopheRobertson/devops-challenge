name: gitops-release

on:
  workflow_run:
    workflows: [ci]
    types: [completed]

permissions:
  contents: write

jobs:
  update-overlay-tag:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Compute image tag
        id: vars
        run: echo "tag=sha-${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"

      - name: Update Kustomize image names and tags
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("k8s/overlays/minikube/kustomization.yaml")
          content = path.read_text()
          owner = "${{ github.repository_owner }}".lower()
          tag = "${{ steps.vars.outputs.tag }}"

          for image in ("devops-challenge", "devops-challenge-migrate"):
              pattern = rf"(  - name: ghcr\.io/moonpay/{image}\n    newName: )ghcr\.io/[^/]+/{image}(\n    newTag: ).*"
              replacement = rf"\1ghcr.io/{owner}/{image}\2{tag}"
              content, count = re.subn(pattern, replacement, content)
              if count != 1:
                  raise SystemExit(f"Expected exactly one image entry for {image}, found {count}")

          path.write_text(content)
          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/overlays/minikube/kustomization.yaml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore(gitops): promote image ${{ steps.vars.outputs.tag }} [skip ci]"
          git push
