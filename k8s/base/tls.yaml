apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: local-ca-bootstrap
  namespace: devops-challenge
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: local-ca
  namespace: devops-challenge
spec:
  isCA: true
  commonName: devops-challenge-local-ca
  secretName: local-ca-key-pair
  duration: 8760h
  issuerRef:
    name: local-ca-bootstrap
    kind: Issuer
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: local-ca
  namespace: devops-challenge
spec:
  ca:
    secretName: local-ca-key-pair
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: web-local-tls
  namespace: devops-challenge
spec:
  secretName: web-tls
  duration: 2160h
  renewBefore: 360h
  issuerRef:
    name: local-ca
    kind: Issuer
  dnsNames:
    - devops-challenge.127.0.0.1.nip.io
