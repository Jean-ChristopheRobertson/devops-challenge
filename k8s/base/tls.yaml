apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: local-selfsigned
  namespace: devops-challenge
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: web-local-tls
  namespace: devops-challenge
spec:
  secretName: web-tls
  issuerRef:
    name: local-selfsigned
    kind: Issuer
  dnsNames:
    - devops-challenge.127.0.0.1.nip.io
