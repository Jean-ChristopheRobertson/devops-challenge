apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  namespace: devops-challenge
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: 'false'
spec:
  ingressClassName: nginx
  rules:
    - host: devops-challenge.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80
